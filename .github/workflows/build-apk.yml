name: Build & Extract Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type to assemble and extract'
        required: true
        default: 'debug'
        type: choice
        options:
          - 'debug'
          - 'release'
          - 'both'
      create_release:
        description: 'Publish APK(s) to GitHub Releases (only on tags or manual release)?'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Extract APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Environment & Secrets
        run: |
          echo "Setting up environment configuration..."
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            cp .env.example .env
            echo ".env created from .env.example"
          elif [ ! -f ".env" ]; then
            touch .env
            echo "Empty .env created"
          fi

      - name: Setup Keystore
        run: |
          echo "Configuring keystore for APK signing..."
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "debug.keystore restored from debug.keystore.base64"
          fi

          if [ ! -f "debug.keystore" ]; then
            echo "Generating fresh debug keystore..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Build Android APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/debug.keystore
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          BUILD_CHOICE="${{ github.event.inputs.build_type || 'debug' }}"
          echo "Selected build variant: $BUILD_CHOICE"

          case "$BUILD_CHOICE" in
            "debug")
              ./gradlew assembleDebug --stacktrace
              ;;
            "release")
              ./gradlew assembleRelease --stacktrace
              ;;
            "both")
              ./gradlew assembleDebug assembleRelease --stacktrace
              ;;
            *)
              ./gradlew assembleDebug --stacktrace
              ;;
          esac

      - name: Extract & Organize APK Files
        id: extract_apk
        run: |
          mkdir -p extracted-apks

          APP_VERSION="1.0"
          if grep -q "versionName" app/build.gradle.kts; then
            APP_VERSION=$(grep 'versionName =' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          echo "Detected App Version: $APP_VERSION"
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT

          echo "Searching for generated APK files..."
          find app/build/outputs/apk/ -name "*.apk" -type f

          # Copy debug APK if exists
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "extracted-apks/PiePlay32-v${APP_VERSION}-debug.apk"
            echo "Extracted: PiePlay32-v${APP_VERSION}-debug.apk"
          fi

          # Copy release APK if exists
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk "extracted-apks/PiePlay32-v${APP_VERSION}-release.apk"
            echo "Extracted: PiePlay32-v${APP_VERSION}-release.apk"
          elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk "extracted-apks/PiePlay32-v${APP_VERSION}-release-unsigned.apk"
            echo "Extracted: PiePlay32-v${APP_VERSION}-release-unsigned.apk"
          fi

          # Generate SHA256 checksums
          cd extracted-apks
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

          # Create step summary for GitHub UI
          echo "### 📱 APK Build & Extraction Summary" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size | SHA256 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          for apk in extracted-apks/*.apk; do
            if [ -f "$apk" ]; then
              FILE_NAME=$(basename "$apk")
              FILE_SIZE=$(ls -lh "$apk" | awk '{print $5}')
              FILE_HASH=$(sha256sum "$apk" | awk '{print $1}')
              echo "| **$FILE_NAME** | $FILE_SIZE | \`$FILE_HASH\` |" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Upload Extracted APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PiePlay32-APK-Artifacts
          path: extracted-apks/
          retention-days: 30
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: extracted-apks/*
          name: PiePlay 32 v${{ steps.extract_apk.outputs.app_version }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
